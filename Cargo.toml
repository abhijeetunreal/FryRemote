[package]
name = "tvremote"
version = "0.1.0"
edition = "2021"
description = "FryRemote — a polished Google TV / Android TV remote control"

[lib]
name = "tvremote"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tvremote-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
prost = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rsa = "0.9"
rand = "0.8"
sha2 = "0.10"
x509-parser = "0.18"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
hex = "0.4"
egui_extras = { version = "0.37", features = ["svg"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu", "eframe"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.21"
ndk-context = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# ---- cargo-apk packaging ----
[package.metadata.android]
package = "dev.fryremote.app"
apk_name = "FryRemote"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "FryRemote"
theme = "@android:style/Theme.Black.NoTitleBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|uiMode"
launch_mode = "singleTop"
orientation = "portrait"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"
[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"
