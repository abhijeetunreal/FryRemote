name: Release Desktop

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v0.2.0). When set, creates or updates the GitHub Release."
        required: false
        default: "v0.2.0"
        type: string
      draft:
        description: "Create as a draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write


jobs:
  build-mac:
    name: Build macOS Universal
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build Apple Silicon & Intel targets
        run: |
          cargo build --release --target aarch64-apple-darwin --bin tvremote-desktop
          cargo build --release --target x86_64-apple-darwin --bin tvremote-desktop

      - name: Package Universal Binary & DMG
        run: |
          mkdir -p package/FryRemote.app/Contents/MacOS
          mkdir -p package/FryRemote.app/Contents/Resources
          mkdir -p dist
          lipo -create -output dist/FryRemote-macos-universal target/aarch64-apple-darwin/release/tvremote-desktop target/x86_64-apple-darwin/release/tvremote-desktop
          chmod +x dist/FryRemote-macos-universal
          cp dist/FryRemote-macos-universal package/FryRemote.app/Contents/MacOS/FryRemote
          if [ -d "assets" ]; then
            cp -r assets package/FryRemote.app/Contents/Resources/ 2>/dev/null || true
          fi
          hdiutil create -volname "FryRemote" -srcfolder package/FryRemote.app -ov -format UDZO dist/FryRemote-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: FryRemote-macos-universal
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI & Windowing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build Linux release
        run: cargo build --release --bin tvremote-desktop

      - name: Package Linux executable file
        run: |
          mkdir -p dist
          cp target/release/tvremote-desktop dist/FryRemote-linux-x86_64
          chmod +x dist/FryRemote-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: FryRemote-linux-x86_64
          path: dist/FryRemote-linux-x86_64
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Windows release
        run: cargo build --release --bin tvremote-desktop

      - name: Package Windows executable file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/tvremote-desktop.exe dist/FryRemote-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FryRemote-windows-x86_64
          path: dist/FryRemote-windows-x86_64.exe
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    needs: [build-mac, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish desktop files to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          name: FryRemote ${{ inputs.tag_name || github.ref_name }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
