name: Build APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v0.1.0). When set, uploads APK to the GitHub Release."
        required: false
        default: "v0.1.0"
        type: string

permissions:
  contents: write

env:
  NDK_VERSION: 26.3.11579264

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-android v3 still bootstraps via the removed `sdkmanager tools` package
      # on newer commandline-tools releases; v4 avoids that legacy bootstrap path.
      - uses: android-actions/setup-android@v4

      - name: Install Android platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      # Updates only install over an older build if the signing key is the same.
      # Add a repository secret KEYSTORE_B64 (base64 of your .keystore) to keep one
      # stable key; otherwise a fresh key is generated for every build.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" \
              -alias tvremote -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tvremote -keypass tvremote -dname "CN=TV Remote"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-tvremote}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: cargo apk build --release --lib

      - uses: actions/upload-artifact@v4
        with:
          name: FryRemote-apk
          path: target/release/apk/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          name: FryRemote ${{ inputs.tag_name || github.ref_name }}
          files: target/release/apk/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
